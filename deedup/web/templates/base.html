<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}deedup{% endblock %}</title>
  <script>
    // Apply the saved theme before the first paint, so dark mode never flashes white.
    (function () {
      var t = null;
      try { t = localStorage.getItem("deedup-theme"); } catch (e) {}
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/static/icon.svg" alt="" width="22" height="22"> deedup</a>
  <nav>
    <a href="/" class="{{ 'on' if nav == 'dashboard' }}">Dashboard</a>
    <a href="/duplicates" class="{{ 'on' if nav == 'duplicates' }}">Duplicates</a>
    <a href="/review" class="{{ 'on' if nav == 'review' }}">Review</a>
    <a href="/browse" class="{{ 'on' if nav in ('browse', 'file') }}">Browse</a>
    <a href="/plans" class="{{ 'on' if nav in ('reorganize', 'plans', 'plan') }}">Plans</a>
    <a href="/archives" class="{{ 'on' if nav in ('archives', 'archive') }}">Archives</a>
    <a href="/changes" class="{{ 'on' if nav in ('changes', 'change') }}">Changes</a>
    <a href="/same-path" class="{{ 'on' if nav == 'same_path' }}">Checks</a>
    <a href="/setup" class="{{ 'on' if nav == 'setup' }}">Setup</a>
  </nav>
  {% if gate and gate.open %}<a class="ro on" href="/changes" title="Changes are allowed. Nothing is changed until you confirm it on the Changes screen.">changes allowed</a>
  {% else %}<span class="ro" title="deedup only reads your files: {{ 'changes are turned off in Setup' if not (gate and gate.allowed) else '/mnt is mounted read-only' }}.">read-only</span>{% endif %}
  <div class="theme" role="group" aria-label="Theme">
    <button type="button" data-theme-choice="system" title="Follow the system setting" aria-label="System theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
    <button type="button" data-theme-choice="light" title="Light" aria-label="Light theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button type="button" data-theme-choice="dark" title="Dark" aria-label="Dark theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>deedup {{ version }} · dedupe your hoard, safely</footer>
</body>
</html>
