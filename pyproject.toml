[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deedup"
version = "0.6.0"
description = "Duplicate finder for Unraid and other big file hoards: dedupe your hoard, safely."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Steve Rodrigue" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "blake3>=1.0",
  "xxhash>=3.4",
  "pillow>=11",
  "pillow-heif>=0.20",
  "pyexiftool>=0.5.6",
  "py7zr>=0.22",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6,<1"]

[project.scripts]
deedup = "deedup.__main__:main"

[tool.setuptools.packages.find]
include = ["deedup*"]

[tool.setuptools.package-data]
deedup = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Pinned so that `make ci`, GitHub CI and any ruff version check the same rules.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long SQL lines read better unwrapped
