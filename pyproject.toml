[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deedup"
version = "0.1.0"
description = "Duplicate finder for Unraid and other big file hoards: dedupe your hoard, safely."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Steve Rodrigue" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "blake3>=1.0",
  "xxhash>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
deedup = "deedup.__main__:main"

[tool.setuptools.packages.find]
include = ["deedup*"]

[tool.setuptools.package-data]
deedup = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
