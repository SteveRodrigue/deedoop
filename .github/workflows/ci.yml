name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The same script as `make ci` on your machine: lint (with the security
  # rules) and tests in the Docker test stage, pip-audit, the image build,
  # a Trivy scan of the image, then a locked-down smoke test.
  # SC9: actions are pinned by commit SHA; Dependabot keeps them current.
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make ci
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push image (latest and the version, so you can roll back)
        if: github.event_name == 'push'
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          for tag in latest "$version"; do
            docker tag deedoop:ci "ghcr.io/steverodrigue/deedoop:$tag"
            docker push "ghcr.io/steverodrigue/deedoop:$tag"
          done
