name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The same script as `make ci` on your machine: lint and tests in the
  # Docker test stage, the image build, then a smoke test of the image.
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: make ci
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push image
        if: github.event_name == 'push'
        run: |
          docker tag deedup:ci ghcr.io/steverodrigue/deedup:latest
          docker push ghcr.io/steverodrigue/deedup:latest
