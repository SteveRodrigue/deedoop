# Example for running deedup outside the Unraid template.
services:
  deedup:
    image: ghcr.io/steverodrigue/deedup:latest
    container_name: deedup
    ports:
      - "8080:8080"
    volumes:
      - /mnt:/mnt:ro,rslave          # read-only: deedup never changes your files
      - /mnt/user/appdata/deedup:/config
    # Locked down: nothing in the image can be changed, no Linux capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # environment:
    #   DEEDUP_ADMIN_PASSWORD: a long passphrase   # first run only; otherwise use the setup code in the log
    #   DEEDUP_TRUSTED_PROXIES: 172.18.0.0/16      # only behind a reverse proxy
    #   DEEDUP_HTTPS: "on"                         # HTTPS on port 8080: your cert in appdata/deedup/tls, or self-signed
    restart: unless-stopped
